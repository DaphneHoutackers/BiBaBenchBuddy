name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            installer: '*-mac-arm64.dmg'
          - os: windows-latest
            platform: win
            installer: '*-Setup.exe'
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate release version and identity
        run: npm run release:check
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build installer without publishing
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run app:${{ matrix.platform }}
      - name: Verify macOS image and application signature
        if: matrix.platform == 'mac'
        run: |
          hdiutil verify release/*-mac-arm64.dmg
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/BiBaBenchBuddy.app
          test "$(lipo -archs release/mac-arm64/BiBaBenchBuddy.app/Contents/MacOS/BiBaBenchBuddy)" = arm64
      - name: Verify installer and generate platform metadata
        run: npm run release:metadata -- release ${{ matrix.platform }}
      - name: Upload versioned installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: release/${{ matrix.installer }}

  release_bundle:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Validate both installers and create release metadata
        run: |
          npm run release:check
          npm run release:metadata
          node --input-type=module -e "import { readFileSync, copyFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json')); copyFileSync('docs/releases/' + version + '.md', 'release/RELEASE_NOTES.md')"
      - name: Upload complete release bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-bundle
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/SHA256SUMS
            release/release-manifest.json
            release/RELEASE_NOTES.md

  create_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release_bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-bundle
          path: release
      - name: Create draft release only for a version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: BiBaBenchBuddy ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.exe
            release/SHA256SUMS
            release/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
